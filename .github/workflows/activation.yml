name: Request Unity Activation File

# Run this once to generate a .alf file.
# Upload that .alf to https://license.unity3d.com/manual
# You'll get back a .ulf — use its contents as the UNITY_LICENSE secret.
# Then delete this workflow file.

on:
  workflow_dispatch: {}

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file
        id: getManualLicenseFile
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6.x.alf
          path: ${{ steps.getManualLicenseFile.outputs.filePath }}
